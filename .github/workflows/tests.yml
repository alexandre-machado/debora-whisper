name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Windows / Python ${{ matrix.python-version }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.14']

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Run tests
        run: python -m pytest tests/ -q --junitxml=.test-results/pytest.xml

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-windows-python-${{ matrix.python-version }}
          path: .test-results/pytest.xml
          if-no-files-found: ignore
          retention-days: 14

  package:
    # Builds the wheel and installs it the way users do (uv tool install), so
    # a missing runtime dependency or a broken entry point fails the PR.
    name: Package / uv tool install
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false  # uv build runs build-backend code

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Build wheel and sdist
        run: uv build

      - name: Install the wheel as a tool
        shell: pwsh
        run: uv tool install --python 3.12 (Get-ChildItem dist/*.whl).FullName

      - name: Smoke test the commands
        shell: pwsh
        run: |
          npu-whisper-cli --help
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npu-whisper --help
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
